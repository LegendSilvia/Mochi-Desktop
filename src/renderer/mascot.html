<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Mochi mascot</title>
    <!-- Same policy as the app window; this one only ever renders the mascot. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               connect-src 'self' http://127.0.0.1:* http://localhost:*;
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               media-src 'self' mochi-asset:;
               img-src 'self' data: mochi-asset:"
    />
    <style>
      /* The window itself is transparent — only the sprite should ever paint. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/mascot.tsx"></script>
  </body>
</html>
